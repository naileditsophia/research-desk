name: 시황 영상 자동 요약 (빈난새 · 이상은)

on:
  schedule:
    # KST 06:00 ~ 10:00 매시 정각 (영상은 주로 아침에 업로드, 자막 생성 지연 대비 재시도)
    - cron: "0 21,22,23,0,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-summaries
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests youtube-transcript-api

      - name: Run video summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/video_summaries.py

      - name: Commit & push
        run: |
          git config user.name "video-bot"
          git config user.email "actions@github.com"
          git add data/auto/videos.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "auto: 시황 영상 요약 발행"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
