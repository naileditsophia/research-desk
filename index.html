<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리서치 데스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="masthead">
      <div class="masthead-mark">RD</div>
      <div class="masthead-text">
        <h1>리서치 데스크</h1>
        <p class="masthead-sub">Research Desk · 투자 기록</p>
      </div>
    </div>
    <div class="masthead-date" id="mastheadDate"></div>

    <nav class="nav" id="nav"><!-- nav items injected --></nav>

    <div class="sidebar-foot">
      <button class="foot-btn" id="btnSearch" title="전체 검색 (Ctrl+K)">
        <span class="foot-ico">⌕</span><span>전체 검색</span>
      </button>
      <button class="foot-btn" id="btnBackup" title="백업 / 가져오기">
        <span class="foot-ico">⤓</span><span>백업 · 설정</span>
      </button>
      <button class="foot-btn" id="btnTheme" title="테마 전환">
        <span class="foot-ico" id="themeIco">◐</span><span id="themeLabel">다크 모드</span>
      </button>
    </div>
  </aside>

  <button class="menu-toggle" id="menuToggle" aria-label="메뉴">☰</button>

  <!-- ===== Main ===== -->
  <main class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <span class="topbar-num" id="topbarNum"></span>
        <h2 id="topbarTitle">오늘</h2>
      </div>
      <div class="topbar-right" id="topbarRight"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <!-- ===== Editor slide-over ===== -->
  <div class="overlay" id="overlay"></div>
  <section class="editor" id="editor" aria-hidden="true">
    <header class="editor-head">
      <div class="editor-head-left">
        <span class="editor-badge" id="editorBadge"></span>
        <span class="save-state" id="saveState"></span>
      </div>
      <div class="editor-head-right">
        <button class="ghost-btn danger" id="btnDelete">삭제</button>
        <button class="ghost-btn" id="btnCloseEditor">닫기 ✕</button>
      </div>
    </header>

    <div class="editor-body">
      <div class="field-row">
        <input type="date" id="fDate" class="f-date" />
        <input type="text" id="fMeta" class="f-meta" placeholder="" />
      </div>
      <input type="text" id="fTitle" class="f-title" placeholder="제목을 입력하세요" />

      <div class="block">
        <div class="block-label">내용 <span class="block-hint">붙여넣기 서식·아이콘 그대로 유지됩니다</span></div>
        <div class="rt-toolbar" data-target="fContent"></div>
        <div class="rt-editor" id="fContent" contenteditable="true" data-ph="여기에 영상 요약 / 뉴스 / 리포트 내용을 붙여넣으세요"></div>
      </div>

      <div class="block thoughts-block">
        <div class="block-label">내 생각 <span class="block-hint">나만의 코멘트·인사이트</span></div>
        <div class="rt-toolbar" data-target="fThoughts"></div>
        <div class="rt-editor" id="fThoughts" contenteditable="true" data-ph="이 내용에 대한 나의 해석, 판단, 액션 아이템을 적어보세요"></div>
      </div>

      <div class="block">
        <div class="block-label">태그</div>
        <div class="tag-input-wrap">
          <div class="tag-chips" id="tagChips"></div>
          <input type="text" id="fTagInput" class="tag-input" placeholder="태그 입력 후 Enter (예: 반도체, 한국전력)" />
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Search modal ===== -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal modal-search">
      <input type="text" id="searchInput" class="search-input" placeholder="제목 · 내용 · 태그 전체 검색…" />
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- ===== Backup modal ===== -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal modal-backup">
      <div class="modal-head">
        <h3>백업 · 설정</h3>
        <button class="ghost-btn" id="btnCloseBackup">✕</button>
      </div>
      <div class="modal-section">
        <h4>데이터 내보내기</h4>
        <p class="modal-desc">기록을 파일로 저장해 두세요. 브라우저 데이터가 지워져도 복원할 수 있습니다.</p>
        <div class="modal-actions">
          <button class="solid-btn" id="btnExportJson">JSON 백업 (.json)</button>
          <button class="ghost-btn" id="btnExportMd">마크다운 (.md)</button>
        </div>
      </div>
      <div class="modal-section">
        <h4>데이터 가져오기</h4>
        <p class="modal-desc">JSON 백업 파일을 불러옵니다. 같은 ID는 덮어쓰고 나머지는 합칩니다.</p>
        <div class="modal-actions">
          <label class="ghost-btn file-label">불러오기 (.json)<input type="file" id="importFile" accept="application/json" hidden /></label>
        </div>
      </div>
      <div class="modal-section">
        <h4>저장 공간</h4>
        <p class="modal-desc" id="storageInfo">—</p>
      </div>
      <div class="modal-section danger-zone">
        <h4>전체 삭제</h4>
        <p class="modal-desc">모든 기록을 영구 삭제합니다. 되돌릴 수 없습니다.</p>
        <div class="modal-actions">
          <button class="ghost-btn danger" id="btnWipe">전체 데이터 삭제</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Link modal for editor -->
  <div class="modal-overlay" id="linkModal">
    <div class="modal modal-link">
      <div class="modal-head"><h3>링크 삽입</h3><button class="ghost-btn" id="btnCloseLink">✕</button></div>
      <input type="text" id="linkUrl" class="search-input" placeholder="https://…" />
      <div class="modal-actions"><button class="solid-btn" id="btnApplyLink">삽입</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
